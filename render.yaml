services:
  - type: web
    name: pg-manager-pro
    env: python
    buildCommand: "pip install -r requirements.txt && flask db upgrade"
    startCommand: "gunicorn --worker-class eventlet -w 1 --threads 4 --bind 0.0.0.0:$PORT app:app"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pg-manager-db
          property: connectionString
databases:
  - name: pg-manager-db
    plan: free
